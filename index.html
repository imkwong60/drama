<style>

dding:5px 7px 1px}.menu-action,.action-panel .filebtn{width:100%;display:flex;align-items:center;justify-content:flex-start;text-align:left;gap:9px;padding:10px 12px;min-height:42px;border-radius:10px;font-size:14px;text-decoration:none}.menu-action:hover,.action-panel .filebtn:hover{border-color:#5e7aa5;background:#263753}.action-panel .primary{background:var(--accent);color:#0b1426;border-color:transparent;font-weight:700}.menu-divider{height:1px;background:var(--line);margin:3px 4px}.wrap{max-width:1240px;margin:auto;padding:0 16px 48px}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:8px 0 16px}.stat,.filters,.toolbar,.item{background:rgba(20,28,47,.94);border:1px solid var(--line);border-radius:16px}.stat{padding:13px 15px}.stat strong{font-size:23px;display:block}.stat span{font-size:12px;color:var(--muted)}.filters{padding:16px;margin-bottom:14px}.filtergrid{display:grid;grid-template-columns:2fr repeat(4,minmax(120px,1fr));gap:10px}.field label{display:block;color:var(--muted);font-size:12px;margin:0 0 5px}.field input,.field select{width:100%;background:#0d1527;border:1px solid var(--line);border-radius:10px;color:var(--text);padding:10px;min-height:43px}.filterfoot{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:12px}.checkline{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:14px}.checkline label{display:flex;align-items:center;gap:7px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 13px;margin-bottom:12px;flex-wrap:wrap}.toolbar .left,.toolbar .right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.toolbar select{background:#0d1527;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:8px}.results{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.item{padding:15px;min-width:0;display:flex;flex-direction:column;gap:8px}.item h2{font-size:18px;line-height:1.35;margin:0;overflow-wrap:anywhere}.original{color:var(--muted);font-size:13px;overflow-wrap:anywhere}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{font-size:12px;color:var(--accent2);border:1px solid #344a6b;background:#192943;padding:3px 8px;border-radius:999px}.details{font-size:13px;color:var(--muted);display:grid;gap:5px}.details b{color:#e6edfb;font-weight:600}.locations{border-top:1px solid var(--line);padding-top:9px;margin-top:auto;display:grid;gap:5px;font-size:13px}.cardactions{display:flex;gap:7px;margin-top:4px}.cardactions button{flex:1;font-size:13px;padding:7px 8px;min-height:38px}.on{color:var(--good)!important;border-color:#396f5d!important}.empty{padding:48px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px;grid-column:1/-1}.notice{font-size:12px;color:var(--muted);margin:12px 2px}.hidden{display:none!important}footer{text-align:center;color:var(--muted);font-size:12px;padding:16px}.filebtn{display:inline-flex;align-items:center;justify-content:center}.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translate(-50%,12px);display:flex;align-items:center;gap:10px;max-width:min(92vw,420px);padding:10px 18px 10px 11px;border-radius:999px;background:rgba(17,27,46,.94);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid #354766;color:var(--text);font-size:14px;line-height:1.35;box-shadow:0 12px 36px #000a;z-index:50;opacity:0;pointer-events:none;transition:opacity .22s,transform .22s}.toast.show{opacity:1;transform:translate(-50%,0)}.toast .ti{flex:0 0 22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;color:#0b1426;background:var(--good)}.toast.warn .ti{background:#ffd88a}.toast.error .ti{background:#ff9b9b}

.itemtop{display:flex;gap:10px;align-items:stretch;min-width:0}.itemmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}.poster{position:relative;align-self:stretch;flex:0 0 clamp(72px,27%,108px);border-radius:10px;overflow:hidden;background:#0d1527;border:1px solid var(--line);cursor:zoom-in;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}.poster:hover{transform:scale(1.04);box-shadow:0 6px 20px #0007;border-color:#5e7aa5}.poster:active{transform:scale(.97)}.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center center;display:block;pointer-events:none}.poster-count{position:absolute;right:5px;bottom:5px;z-index:1;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:rgba(11,20,38,.88);border:1px solid #5e7aa5;color:var(--accent2);font-size:11px;font-weight:700;display:grid;place-items:center;pointer-events:none;line-height:1}.lightbox{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:max(20px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));background:rgba(4,7,16,.9);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .28s ease,visibility .28s ease}.lightbox.open{opacity:1;visibility:visible;pointer-events:auto}.lightbox-panel{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px;max-width:min(94vw,760px);max-height:min(90vh,920px);transform:scale(.92) translateY(16px);opacity:0;transition:transform .32s cubic-bezier(.22,1,.36,1),opacity .28s ease}.lightbox.open .lightbox-panel{transform:scale(1) translateY(0);opacity:1}.lightbox-img-wrap{position:relative;border-radius:16px;overflow:hidden;background:#0a1224;border:1px solid #3a4f72;box-shadow:0 28px 72px #000d,0 0 0 1px #ffffff0a;max-width:100%;max-height:min(78vh,820px)}.lightbox-img-wrap img{display:block;max-width:min(94vw,760px);max-height:min(78vh,820px);width:auto;height:auto;object-fit:contain;vertical-align:middle}.lightbox-title{color:var(--text);font-size:15px;font-weight:650;text-align:center;line-height:1.4;max-width:min(90vw,640px);overflow-wrap:anywhere;text-shadow:0 2px 12px #000a;padding:0 8px}.lightbox-close{position:absolute;top:calc(14px + env(safe-area-inset-top));right:calc(14px + env(safe-area-inset-right));width:46px;height:46px;border-radius:50%;border:1px solid #3a4f72;background:rgba(17,27,46,.92);color:var(--text);font-size:24px;line-height:1;cursor:pointer;display:grid;place-items:center;z-index:2;box-shadow:0 6px 20px #0008;transition:background .15s,border-color .15s,transform .15s;padding:0}.lightbox-close:hover{background:#2a3d5c;border-color:var(--accent);transform:scale(1.06)}.lightbox-close:active{transform:scale(.95)}.lightbox-hint{font-size:12px;color:var(--muted);opacity:.75;margin-top:-4px}
.lightbox-nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;border:1px solid #3a4f72;background:rgba(17,27,46,.9);color:var(--text);font-size:28px;line-height:1;cursor:pointer;display:grid;place-items:center;z-index:3;box-shadow:0 6px 20px #0008;transition:background .15s,border-color .15s,transform .15s,opacity .2s;padding:0;user-select:none}
.lightbox-nav:hover{background:#2a3d5c;border-color:var(--accent)}
.lightbox-nav:active{transform:translateY(-50%) scale(.94)}
.lightbox-nav:disabled,.lightbox-nav[aria-disabled="true"]{opacity:.25;pointer-events:none}

<body><header><div><h1><img src="icon-192.png" alt="" width="36" height="36" style="width:36px;height:36px;border-radius:9px;vertical-align:-8px;margin-right:8px">追劇本本</h1><p id="listUpdated">作品清單最後更新：—</p></div><details class="action-menu"><summary aria-label="開啟資料管理清單">☰ 資料管理 <span class="menu-caret">▾</span></summary><div class="action-panel"><div class="menu-heading">資料管理</div><button class="menu-action" id="updateCsvBtn" type="button">🔄 更新雲端作品清單</button><button class="menu-action primary" id="fullExportBtn" type="button">🗃️ 匯出完整備份（含收藏）</button><label class="filebtn menu-action" for="backupJsonInput">📥 匯入完整備份（JSON）</label><input id="backupJsonInput" type="file" accept=".json,application/json" style="display:none"><div class="menu-divider"></div><div class="menu-heading">Supabase 雲端備份</div><div class="field" style="padding:0 4px 2px"><label for="sbEmailInput" style="margin:0 0 4px">使用者 Email（備份／匯入用）</label><input id="sbEmailInput" type="email" inputmode="email" autocomplete="email" placeholder="name@example.com" style="width:100%;background:#0d1527;border:1px solid var(--line);border-radius:10px;color:var(--text);padding:9px 10px;min-height:40px;font-size:14px"><div id="sbEmailHint" style="font-size:11px;color:var(--muted);margin-top:4px;min-height:14px"></div></div><button class="menu-action primary" id="supabaseBackupBtn">☁️ 完整備份至 Supabase</button><button class="menu-action" id="supabaseRestoreBtn">⬇️ 匯入 Supabase 備份</button><button class="menu-action hidden" id="installBtn">📲 安裝 App</button></div></details></header>
<main class="wrap"><section class="stats"><div class="stat"><strong id="totalCount">0</strong><span>資料庫作品</span></div><div class="stat"><strong id="shownCount">0</strong><span>目前篩選結果</span></div><div class="stat"><strong id="favCount">0</strong><span>我的收藏</span></div></section>
<section class="filters"><div class="filtergrid"><div class="field searchfield"><label for="search">關鍵字搜尋</label><input id="search" placeholder="劇名、原文、演員、類型、備份位置…" autocomplete="off"></div><div class="field"><label for="typeFilter">作品類型</label><select id="typeFilter"><option value="">全部作品類型</option></select></div><div class="field"><label for="actorFilter">演員／聲優</label><select id="actorFilter"><option value="">全部演員／聲優</option></select></div><div class="field"><label for="themeFilter">題材</label><select id="themeFilter"><option value="">全部題材</option></select></div><div class="field"><label for="languageFilter">語言</label><select id="languageFilter"><option value="">全部語言</option></select></div><div class="field"><label for="yearFilter">年份</label><select id="yearFilter"><option value="">全部年份</option></select></div></div><div class="filterfoot"><div class="checkline"><label><input id="favOnly" type="checkbox"> 只看收藏</label><label><input id="watchedOnly" type="checkbox"> 只看已觀看</label><label><input id="unwatchedOnly" type="checkbox"> 未觀看</label></div><button id="resetBtn">清除篩選</button></div></section>
<section class="toolbar"><div class="left"><span id="resultLabel">載入資料後開始使用</span></div><div class="right"><label for="sortSelect" class="hidden">排序</label><select id="sortSelect"><option value="title">按中文名稱排序</option><option value="added">最新加入</option><option value="yearDesc">年份：新到舊</option><option value="yearAsc">年份：舊到新</option><option value="episodesDesc">集數：多到少</option><option value="episodesAsc">集數：少到多</option></select><button id="viewBtn">切換列表</button></div></section>
<section id="results" class="results" aria-live="polite"></section><p class="notice">作品清單、收藏及觀看狀態均儲存在本機。請定期匯出「完整備份（JSON）」，或備份至 Supabase，避免清除瀏覽器資料後遺失。</p></main><footer>影視資料庫 PWA · 支援完整 JSON 備份及 Supabase 雲端備份 · 本機資料優先</footer><div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="劇照放大預覽"><button type="button" class="lightbox-close" id="lightboxClose" aria-label="關閉">×</button><button type="button" class="lightbox-nav lightbox-prev" id="lightboxPrev" aria-label="上一張">‹</button><button type="button" class="lightbox-nav lightbox-next" id="lightboxNext" aria-label="下一張">›</button><div class="lightbox-panel"><div class="lightbox-img-wrap"><img id="lightboxImg" src="" alt=""></div><div class="lightbox-title" id="lightboxTitle"></div><div class="lightbox-counter" id="lightboxCounter"></div><div class="lightbox-hint">左右滑動或按 ← → 切換 · Esc 關閉</div></div></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
const DBKEY='dramalist_pwa_v1', METAKEY='dramalist_meta_v1';
const COLS=['中文名稱','英文名稱 / 原文名稱','類形','年份','集數','語言','主要演員 / 聲優','Media Type','Backup 1','backup 2','poster','劇照 1','劇照 2','劇照 3','劇照 4'];
let rows=[],meta={},listView=false,installPrompt=null;
const $=id=>document.getElementById(id);
function toast(msg,type){type=type||(/失敗|不足|不正確|找不到/.test(msg)?'error':/^請|沒有資料/.test(msg)?'warn':'ok');const el=$('toast');el.className='toast'+(type==='ok'?'':' '+type);el.innerHTML='<span class="ti">'+({ok:'✓',warn:'!',error:'×'})[type]+'</span><span class="tm"></span>';el.lastChild.textContent=msg;void el.offsetWidth;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),type==='error'?3600:2400)}
function norm(s){return String(s??'').trim()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function parseCSV(text){text=text.replace(/^\uFEFF/,'');let out=[],row=[],cell='',q=false;for(let i=0;i<text.length;i++){let c=text[i];if(c==='"'){if(q&&text[i+1]==='"'){cell+='"';i++}else q=!q}else if(c===','&&!q){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x.trim()!==''))out.push(row);row=[];cell=''}else cell+=c}if(cell!==''||row.length){row.push(cell);if(row.some(x=>x.trim()!==''))out.push(row)}if(!out.length)return[];const headers=out.shift().map(x=>x.trim());return out.map(a=>Object.fromEntries(headers.map((h,i)=>[h,norm(a[i])])))}
function get(r,key){return norm(r[key])}
function pickPoster(r){for(const k of Object.keys(r||{})){if(/^poster/i.test(String(k).trim()))return norm(r[k])}return ''}
function collectImages(r){const urls=[];const seen=new Set();const add=u=>{u=norm(u);if(/^https?:\/\//i.test(u)&&!seen.has(u)){seen.add(u);urls.push(u)}};if(!r)return urls;add(pickPoster(r)||get(r,'poster'));const keys=Object.keys(r);keys.filter(k=>/^劇照\s*\d+$/i.test(String(k).trim())||/^still/i.test(String(k).trim())).sort((a,b)=>a.localeCompare(b,'zh-Hant',{numeric:true})).forEach(k=>add(r[k]));['劇照 1','劇照 2','劇照 3','劇照 4'].forEach(k=>add(get(r,k)));return urls}
function keyFor(r){return [get(r,COLS[0]),get(r,COLS[1]),get(r,COLS[3])].join('|').toLowerCase()}
function save(){try{localStorage.setItem(DBKEY,JSON.stringify(rows));localStorage.setItem(METAKEY,JSON.stringify(meta))}catch(e){toast('儲存空間不足，請匯出備份')}}
function load(){try{rows=JSON.parse(localStorage.getItem(DBKEY)||'[]');meta=JSON.parse(localStorage.getItem(METAKEY)||'{}')}catch{rows=[];meta={}}}
function options(id,values,first){const sel=$(id),prev=sel.value;sel.innerHTML=`<option value="">${first}</option>`+[...new Set(values.filter(Boolean))].sort((a,b)=>a.localeCompare(b,'zh-Hant',{numeric:true})).map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('');if([...sel.options].some(o=>o.value===prev))sel.value=prev}
// 類形欄可能混有演員／其他標籤。重要：只認「完整標籤」符合清單的項目，不能用關鍵字包含判斷，否則愛情劇、校園劇等也會被錯當成作品大類。
const TYPE_ALIASES = new Map([
 ['電影','電影'],['電影版','電影'],['日影','電影'],['韓影','電影'],['港影','電影'],['台影','電影'],['國產電影','電影'],['movie','電影'],['movies','電影'],['film','電影'],['films','電影'],
 ['日劇','日劇'],['日本劇','日劇'],['韓劇','韓劇'],['韓國劇','韓劇'],['美劇','美劇'],['美國劇','美劇'],['台劇','台劇'],['台灣劇','台劇'],['港劇','港劇'],['香港劇','港劇'],['中劇','陸劇'],['陸劇','陸劇'],['中國劇','陸劇'],['泰劇','泰劇'],['英劇','英劇'],['法劇','法劇'],['德劇','德劇'],['網劇','網劇'],['電視劇','電視劇'],['短劇','短劇'],
 ['動畫','動畫'],['動漫','動畫'],['anime','動畫'],['ova','動畫'],['綜藝','綜藝'],['番組','綜藝'],['紀錄片','紀錄片'],['紀錄','紀錄片'],['特攝','特攝'],['舞台劇','舞台劇'],['劇場版','電影'],['tv show','電視節目'],['series','電視劇'],['drama','電視劇']
]);
function splitTags(v){return String(v||'').split(/[、,，;；|／\/]+/).map(x=>x.trim()).filter(Boolean)}
function canonicalType(tag){return TYPE_ALIASES.get(String(tag||'').trim().toLocaleLowerCase()) || TYPE_ALIASES.get(String(tag||'').trim()) || ''}
